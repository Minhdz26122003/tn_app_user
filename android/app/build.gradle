plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

android {
    namespace = "com.example.app_hm"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
android
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.app_hm"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }
    // new 
    // signingConfigs {
    //     debug {
    //         storeFile file('D:/Documents/Flutter/app_hm/android/debug.keystore') 
    //         storePassword 'android'
    //         keyAlias 'androiddebugkey'
    //         keyPassword 'android'
    //     }
    // }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
    // buildTypes {
    //     release {
    //         // Sử dụng debug signing config cho bản release để dễ dàng build APK test
    //         //signingConfig signingConfigs.debug

    //         // Bật minify và shrink (quan trọng để ProGuard hoạt động)
    //         minifyEnabled true
    //         shrinkResources true // Tùy chọn nhưng khuyến nghị để giảm kích thước APK

    //         // Chỉ định tệp quy tắc ProGuard
    //         proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    //     }
    //      debug {
    //         // Cấu hình cho bản debug (thường không cần minify)
    //         minifyEnabled false
    //         shrinkResources false
    //     }
    // }
}

flutter {
    source = "../.."
}
dependencies{
    implementation platform('com.google.firebase:firebase-bom:33.9.0')

